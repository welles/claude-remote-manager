name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NX_NO_CLOUD: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test build

  # The Nix package, the NixOS module's VM tests and its evaluation checks
  # (nix flake check). Independent of the image; KVM runs the VMs.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: npm dependency hash matches package-lock.json
        run: |
          if ! nix build -L --no-link .#default.npmDeps 2> npm-deps.log; then
            cat npm-deps.log
            if grep -q 'hash mismatch' npm-deps.log; then
              echo "::error file=nix/npm-deps-hash.json::package-lock.json changed: run nix/update-npm-deps-hash.sh and commit nix/npm-deps-hash.json"
            fi
            exit 1
          fi

      - name: Build the package
        run: nix build -L .#default

      - name: Flake checks (VM tests, module evaluation)
        run: nix flake check -L

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Commit time
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version != '' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0' }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
