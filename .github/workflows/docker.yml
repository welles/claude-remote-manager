name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NX_NO_CLOUD: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test build

  # The Nix package, the NixOS module's VM tests and its evaluation checks
  # (nix flake check). Independent of the image; KVM runs the VMs.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The VM tests need KVM; without it they would not run at all (the
      # kvm system feature is missing), so the job fails here instead.
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            grep -cE 'vmx|svm' /proc/cpuinfo || true
            echo "::error::/dev/kvm does not exist on this runner; the NixOS VM tests cannot run"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the event; wait until udev has applied it.
          sudo udevadm settle --timeout=30 || true
          if [ ! -w /dev/kvm ]; then
            # The rule did not apply (yet); the runner is disposable.
            sudo chmod 0666 /dev/kvm
          fi
          ls -l /dev/kvm
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not writable; the NixOS VM tests cannot run"
            exit 1
          fi

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: npm dependency hash matches package-lock.json
        run: |
          if ! nix build -L --no-link .#default.npmDeps 2> npm-deps.log; then
            cat npm-deps.log
            if grep -q 'hash mismatch' npm-deps.log; then
              echo "::error file=nix/npm-deps-hash.json::package-lock.json changed: run nix/update-npm-deps-hash.sh and commit nix/npm-deps-hash.json"
            fi
            exit 1
          fi

      - name: Build the package
        run: nix build -L .#default

      - name: Flake checks (VM tests, module evaluation)
        run: nix flake check -L

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Commit time
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: claude-remote-manager:smoke
          cache-from: type=gha

      - name: Smoke test
        run: docker/smoke-test.sh claude-remote-manager:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version != '' && startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '0.0.0' }}
            COMMIT=${{ github.sha }}
            COMMIT_TIME=${{ steps.commit.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a green run on main: the owner's NixOS configuration
  # (welles/nixos-config) updates its flake input claude-remote-manager to this
  # commit (its workflow update-claude-remote-manager.yml), so the next deploy
  # brings this version. Needs the secret NIXOS_CONFIG_DISPATCH_TOKEN: a
  # fine-grained token for welles/nixos-config only, with "Actions: read and
  # write" (starting a workflow; it cannot change code). Skipped without it.
  update-nixos-config:
    needs: [test, nix, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.NIXOS_CONFIG_DISPATCH_TOKEN }}
    steps:
      - name: Start the flake input update in welles/nixos-config
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
          REV: ${{ github.sha }}
        run: |
          gh workflow run update-claude-remote-manager.yml \
            --repo welles/nixos-config --ref main -f rev="$REV"

      - name: Skipped (no token)
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::NIXOS_CONFIG_DISPATCH_TOKEN is not set; welles/nixos-config is not asked to update."
