<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude Remote Manager</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The surface colour of the theme (styles/_theme-colors.scss). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#101418"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f9ff"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Claude RM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- With credentials: behind Cloudflare Access the manifest needs the cookie. -->
    <link
      rel="manifest"
      href="manifest.webmanifest"
      crossorigin="use-credentials"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
