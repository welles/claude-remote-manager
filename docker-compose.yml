services:
  claude-remote-manager:
    # Builds the image locally; to use the published image instead, replace
    # this with image: ghcr.io/<owner>/claude-remote-manager:latest
    build: .
    image: claude-remote-manager:local
    container_name: claude-remote-manager
    restart: unless-stopped
    ports:
      # Loopback only: the app has no login of its own (in production it sits
      # behind Cloudflare Access) and runs an agent with broad tool permissions.
      # Expose it further only through an authenticating proxy or tunnel.
      - '127.0.0.1:8080:8080'
    environment:
      TZ: ${TZ:-UTC}
      # Authentication of the API (required, no default). Behind Cloudflare
      # Access the API verifies the Access token itself:
      #   AUTH_MODE: cloudflare-access
      #   CF_ACCESS_TEAM_DOMAIN: <team>.cloudflareaccess.com
      #   CF_ACCESS_AUD: <application audience tag>
      #   CF_ACCESS_ALLOWED_EMAILS: you@example.com   (optional)
      # This local setup publishes the port on loopback only and runs
      # unauthenticated:
      AUTH_MODE: none
      # Public host name the app is reached under (behind the tunnel); the
      # API refuses other Host headers except loopback names.
      # ALLOWED_HOSTS: crm.example.com
      # GitHub App (optional): App ID and the private key as secret file.
      # Without them the app runs without GitHub (local projects and clone
      # URLs still work).
      # GITHUB_APP_ID: '123456'
      # GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-key
      # Previews of dev servers (optional): Claude's exposed ports get host
      # names <session>-<port>.<preview domain>, served through this one port
      # (a wildcard route in the tunnel; no further ports are published).
      # Locally, browsers resolve *.localhost to loopback:
      # PREVIEW_URL: http://preview.localhost:8080
      # Behind Cloudflare Access the previews need an Access application of
      # their own, with an audience tag other than CF_ACCESS_AUD:
      #   PREVIEW_URL: https://preview.example.com
      #   PREVIEW_ACCESS_AUD: <audience tag of the preview application>
      # PR automation: the secret of the GitHub App's webhook (without it
      # the webhook refuses everything and pull requests are polled).
      # GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github-webhook-secret
    # The key file must be readable by UID 1000 (the API user) and not by
    # UID 1001 (the session user), e.g. owned by 1000 with mode 0400.
    # secrets:
    #   - github-app-key
    #   - github-webhook-secret
    # Log in to Claude as the session user:
    #   docker compose exec -u claude claude-remote-manager claude
    volumes:
      # Session workspace on one filesystem: repos/ (mirrors), sessions/
      # (one clone per session and repository, hardlinked), scratch/
      - workspace:/data/workspace
      # Claude Code configuration: login, settings, session transcripts
      - claude:/data/claude
      # SSH key (ssh/), git config and credentials
      - git:/data/git
      # SQLite database
      - db:/data/db
      # Nix store, keeps downloaded tools across container re-creations
      - nix:/nix

# The GitHub App's private key, bind-mounted read-only at
# /run/secrets/github-app-key; the file must be readable by UID 1000.
# secrets:
#   github-app-key:
#     file: ./secrets/github-app.pem
#   github-webhook-secret:
#     file: ./secrets/github-webhook-secret

volumes:
  workspace:
  claude:
  git:
  db:
  nix:
