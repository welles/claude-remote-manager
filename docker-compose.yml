services:
  claude-remote-manager:
    # Builds the image locally; to use the published image instead, replace
    # this with image: ghcr.io/<owner>/claude-remote-manager:latest
    build: .
    image: claude-remote-manager:local
    container_name: claude-remote-manager
    restart: unless-stopped
    ports:
      # Loopback only: the app has no login of its own (in production it sits
      # behind Cloudflare Access) and runs an agent with broad tool permissions.
      # Expose it further only through an authenticating proxy or tunnel.
      - '127.0.0.1:8080:8080'
    environment:
      TZ: ${TZ:-UTC}
      # Public host name the app is reached under (behind the tunnel); the
      # API refuses other Host headers except loopback names.
      # ALLOWED_HOSTS: crm.example.com
    volumes:
      # Session workspace on one filesystem: repos/ (mirrors), sessions/
      # (one clone per session and repository, hardlinked), scratch/
      - workspace:/data/workspace
      # Claude Code configuration: login, settings, session transcripts
      - claude:/data/claude
      # SSH key (ssh/), git config and credentials
      - git:/data/git
      # SQLite database
      - db:/data/db
      # Nix store, keeps downloaded tools across container re-creations
      - nix:/nix

volumes:
  workspace:
  claude:
  git:
  db:
  nix:
