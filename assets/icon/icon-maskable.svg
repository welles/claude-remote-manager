<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b3a"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a45c"/>
      <stop offset="1" stop-color="#e2683c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#1B1F2A"/>
  <g transform="translate(256 256) scale(1.02) translate(-256 -256)">

  <!-- three parallel sessions branching from one repository -->
  <g fill="none" stroke-linecap="round" stroke-width="22">
    <path d="M132 256 C 220 256, 220 150, 310 150 L 372 150" stroke="url(#warm)"/>
    <path d="M132 256 L 372 256" stroke="#e9ecf4"/>
    <path d="M132 256 C 220 256, 220 362, 310 362 L 372 362" stroke="#7fb4ff"/>
  </g>

  <!-- repository node -->
  <circle cx="132" cy="256" r="34" fill="#11141c" stroke="#e9ecf4" stroke-width="18"/>

  <!-- session nodes -->
  <circle cx="384" cy="150" r="30" fill="#e2683c"/>
  <circle cx="384" cy="256" r="30" fill="#e9ecf4"/>
  <circle cx="384" cy="362" r="30" fill="#7fb4ff"/>

  <!-- prompt chevrons inside the session nodes -->
  <g fill="none" stroke="#11141c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M377 137 L 391 150 L 377 163"/>
    <path d="M377 243 L 391 256 L 377 269"/>
    <path d="M377 349 L 391 362 L 377 375"/>
  </g>
  </g>
</svg>
